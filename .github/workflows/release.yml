name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: review-fixture-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PROXYDIABLO_TEST_MYSQL_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: echo "XDG_CONFIG_HOME=$RUNNER_TEMP/proxydiablo-test-config" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - run: npm run typecheck
      - name: Enable adversarial MySQL quoting mode
        run: >-
          node --input-type=module -e
          'import mysql from "mysql2/promise";
          const db = await mysql.createConnection({host: "127.0.0.1", port: 3306, user: "root", password: "review-fixture-only"});
          await db.query("SET GLOBAL sql_mode = ?", ["NO_BACKSLASH_ESCAPES"]);
          await db.end();'
      - run: npm test
      - run: npm run build
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Proxy Diablo $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
